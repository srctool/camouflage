name: Release

# The umbrella release of srctool/camouflage. It publishes nothing: kotlin-lib and dart-lib are
# released (tagged and published) in their own repositories first. This release records which
# library versions belong together, through the submodule pointers.
#
# Run by hand from the Actions tab (Run workflow → branch main → tag).
# If the tag doesn't exist yet, it's created on the latest commit of main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v1.2.3 (created on main if it does not exist)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}

jobs:
  create_github_release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: Check inputs
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got '$TAG')"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run the release from main (got $GITHUB_REF)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .gitmodules uses SSH URLs; the runner has no SSH key, so fetch the (public) submodules over HTTPS.
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Use the existing tag, if any
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
            echo "Using existing tag $TAG at $(git rev-parse --short HEAD)"
          else
            echo "Tag $TAG doesn't exist yet; releasing main at $(git rev-parse --short HEAD)"
          fi

      - name: Check each library is at a release tag
        id: libs
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          notes=""
          missing=0
          for sub in $(git config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            git -C "$sub" fetch -q --tags origin
            commit="$(git -C "$sub" rev-parse --short HEAD)"
            tags="$(git -C "$sub" tag --points-at HEAD | paste -sd ',' - | sed 's/,/, /g')"
            if [[ -z "$tags" ]]; then
              echo "::error::$sub is at $commit, which has no release tag. Tag and publish it in its own repository, then point the submodule at that commit."
              missing=1
            else
              echo "$sub: $tags ($commit)"
              notes+="- \`$sub\`: $tags ($commit)"$'\n'
            fi
          done
          [[ "$missing" == 0 ]] || exit 1
          {
            echo "notes<<RELEASE_NOTES_EOF"
            printf '%s' "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create the tag if it doesn't exist
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            echo "Created tag $TAG at $(git rev-parse --short HEAD)"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          # The library versions come first; GitHub's generated notes are appended after them.
          body: |
            ## Library versions

            ${{ steps.libs.outputs.notes }}
          generate_release_notes: true

  update_root_changelog:
    name: Update root changelog
    needs: create_github_release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Append the release notes to CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(gh release view "$TAG" --json body --jq .body)"
          printf '\n## %s\n\n%s\n' "$TAG" "$notes" >> CHANGELOG.md
      - name: Commit and push (skipped if main is protected)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(docs): update root CHANGELOG for $TAG" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push skipped (main is protected or no permission)"
      # The docs sites are built and deployed by docs.yml.
